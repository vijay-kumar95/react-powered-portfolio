name: CI-CD Docker Pipeline

on:
  push:
    branches: [ "custom" ]

jobs:

  # ========================
  # CI JOB (Build Docker Image)
  # ========================
  ci:
    runs-on: ubuntu-22.04

    steps:
    # Checkout source code
    - name: Checkout code
      uses: actions/checkout@v4

    # Setup Node (for building app before dockerizing)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    # Install dependencies
    - name: Install dependencies
      run: npm ci

    # Build project (generates static files like /build)
    - name: Build app
      run: npm run build

